<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing - Outpost Climbing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-blue: #92c7d7;
      --brand-cream: #f0e8db;
      --brand-tan: #d9b382;
      --brand-green: #4c6a5f;
      --brand-yellow: #f3c37a;

      --orange: var(--brand-yellow);
      --blue: var(--brand-blue);
      --green: var(--brand-green);
      --yellow: var(--brand-tan);
      --purple: var(--brand-green);
      --bg-light: var(--brand-cream);
      --text-dark: var(--brand-green);
    }

    body { margin: 0; font-family: 'Quicksand', sans-serif; background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: 'Fredoka', sans-serif; margin-top: 0; }
    a { text-decoration: none; color: inherit; }

    /* Navbar */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: var(--purple); }
    .nav-logo img { height: 40px; object-fit: contain; }
    .nav-links { display: flex; gap: 30px; align-items: center; }
    .nav-links a { font-weight: 700; font-size: 18px; color: var(--text-dark); transition: color 0.2s; }
    .nav-links a:hover { color: var(--orange); }

    /* Buttons */
    .btn { background-color: var(--orange); color: var(--text-dark) !important; padding: 12px 28px; border-radius: 30px; font-weight: 700; font-size: 18px; box-shadow: 0 4px 0 #d9a85c; transition: all 0.1s; display: inline-block; text-align: center; cursor: pointer; border: none; }
    .btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 #d9a85c; }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .btn.blue { background-color: var(--blue); box-shadow: 0 4px 0 #72a5b5; color: white !important; }
    .btn.blue:hover { box-shadow: 0 2px 0 #72a5b5; }

    /* Hero */
    .hero { background-color: var(--blue); color: white; padding: 100px 20px 140px 20px; text-align: center; position: relative; }
    .hero h1 { font-size: clamp(40px, 6vw, 70px); margin-bottom: 20px; text-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
    .hero p { font-size: 22px; max-width: 750px; margin: 0 auto 40px auto; font-weight: 700; color: rgba(255,255,255,0.9); }
    
    .wave { position: absolute; bottom: 0; left: 0; width: 100%; overflow: hidden; line-height: 0; transform: translateY(1px); }
    .wave svg { position: relative; display: block; width: calc(100% + 1.3px); height: 80px; }
    .wave .shape-fill { fill: var(--bg-light); }

    /* Pricing Section */
    .section { padding: 80px 5%; max-width: 1200px; margin: 0 auto; text-align: center; }
    .section-title { font-size: 45px; color: var(--purple); margin-bottom: 50px; }
    
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
    
    .pricing-card { 
      background: white; border-radius: 35px; padding: 50px 30px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.06); transition: transform 0.3s; 
      border: 4px solid transparent; display: flex; flex-direction: column; 
    }
    .pricing-card.featured {
      border-color: var(--orange);
      transform: scale(1.05);
      position: relative;
    }
    .pricing-card.featured:hover { transform: scale(1.05) translateY(-10px); }
    .pricing-card:hover { transform: translateY(-10px); }
    
    .badge {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      background: var(--orange); color: var(--text-dark); padding: 5px 20px;
      border-radius: 20px; font-weight: bold; font-size: 14px;
    }

    .pricing-card h3 { font-size: 28px; margin-bottom: 15px; }
    .price { font-size: 55px; font-family: 'Fredoka', sans-serif; color: var(--purple); margin-bottom: 10px; }
    .price span { font-size: 20px; color: #888; font-family: 'Quicksand', sans-serif; }
    
    .features-list { list-style: none; padding: 0; margin: 30px 0; text-align: left; flex-grow: 1; }
    .features-list li { font-size: 18px; color: #555; font-weight: 500; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .features-list li::before { content: '✓'; color: var(--green); font-weight: bold; font-size: 22px; }

    /* Footer */
    footer { background: var(--purple); color: white; text-align: center; padding: 40px 20px; font-weight: 600; margin-top: 80px; }
  
    /* Mobile Responsive */
    .hamburger { display: none; font-size: 30px; background: none; border: none; cursor: pointer; color: var(--purple); }
    @media (max-width: 1100px) {
      .hamburger { display: block; }
      .nav-links {
        position: absolute; top: 100%; left: 0; width: 100%;
        background: white; flex-direction: column;
        align-items: flex-start !important; padding: 20px 5% 40px 5% !important; gap: 0 !important;
        box-shadow: 0 15px 20px rgba(0,0,0,0.1); box-sizing: border-box;
        opacity: 0; visibility: hidden; pointer-events: none;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 99;
      }
      .nav-links.active {
        opacity: 1; visibility: visible; pointer-events: auto;
        transform: translateY(0);
      }
      .nav-links > div { width: 100%; margin-bottom: 15px; box-sizing: border-box; }
      .nav-links > div select { width: 100%; }
      .nav-links a:not(.btn) { width: 100%; padding: 15px 0; border-bottom: 1px solid #eee; display: block; }
      .nav-links .btn { width: 100%; margin-top: 20px; box-sizing: border-box; }
      
      /* Make sure feature cards scale properly */
      .hero { padding: 80px 20px 100px 20px; }
      .hero h1 { font-size: clamp(35px, 10vw, 50px); }
      .section-title { font-size: 35px; }
    }
</style>
</head>
<body>

          <option value="index.html">Outpost Main</option>

  <script>
  (function () {
    var IFRAME_SELECTOR = ".rezerv-widget-iframe";
    var WIDGET_ORIGIN = "https://widgets.rezerv.co";
    var UTM_REQUEST_MESSAGE_TYPE = "REQUEST_UTM_PARAMS";
    var UTM_KEYS = ["utm_source", "utm_campaign", "utm_medium", "utm_term", "utm_content"];
    
    function collectUtms() {
      var params = new URLSearchParams(window.location.search);
      var utms = {};
      UTM_KEYS.forEach(function (key) {
        var value = params.get(key);
        if (value) utms[key] = value;
      });
      return utms;
    }
    
    function postUtmsToWidget(iframe, utms) {
      if (!iframe || !iframe.contentWindow || Object.keys(utms).length === 0) return;
      iframe.contentWindow.postMessage({ type: "UTM_PARAMS", utms: utms }, WIDGET_ORIGIN);
    }
    
    function init() {
      var iframes = document.querySelectorAll(IFRAME_SELECTOR);
      if (iframes.length === 0) return;
      
      var utms = collectUtms();
      
      iframes.forEach(function(iframe) {
        function sendUtms() {
          postUtmsToWidget(iframe, utms);
        }
        iframe.addEventListener("load", function () {
          sendUtms();
          setTimeout(sendUtms, 500);
          setTimeout(sendUtms, 1500);
        });
      });
      
      window.addEventListener("message", function (event) {
        if (event.origin !== WIDGET_ORIGIN) return;
        if (event.data && event.data.type === UTM_REQUEST_MESSAGE_TYPE) {
          iframes.forEach(function(iframe) {
            // We just broadcast to all iframes if one requests it
            postUtmsToWidget(iframe, utms);
          });
        }
      });
      
      iframes.forEach(function(iframe) {
        postUtmsToWidget(iframe, utms);
      });
    }
    
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
